<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CBZ Player v5</title>
  </head>
  <body class="bg-zinc-900 text-zinc-100 overflow-hidden">
    <div id="root"></div>
    <script>
      // Allow file drops by preventing default navigation behavior
      document.addEventListener('dragover', (e) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'copy';
      }, true);
      document.addEventListener('drop', (e) => {
        e.preventDefault();
      }, true);
    </script>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
